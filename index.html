<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayYou Nigeria</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F8F9FF}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 12px;background:#fff}
.header h2{font-size:19px;font-weight:900;color:#0F2A4D}
.header h2 span{color:#E6B800}
.header small{display:block;font-size:11px;color:#666;font-weight:400}
.btn-login{background:#0F2A4D;color:#fff;padding:10px 18px;border-radius:24px;border:none;font-size:13px;font-weight:700}
.nav-pills{background:#0F2A4D;border-radius:24px;margin:8px 12px;padding:11px 14px;display:flex;justify-content:space-between;color:#fff;font-size:13px;font-weight:700}
.hero-navy{background:#0F2A4D;border-radius:20px;margin:10px 12px;padding:20px 16px;color:#fff}
.badge-yellow{background:#FFD700;color:#0F2A4D;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:900;display:inline-block;margin-bottom:8px}
.hero-navy h1{font-size:27px;line-height:1.15;font-weight:900}
.hero-navy h1 .y{color:#FFD700}
.hero-navy .sub{font-size:13px;margin-top:6px;opacity:0.9}
.refer-yellow{background:#FFD700;color:#0F2A4D;border-radius:24px;padding:10px 16px;font-size:13px;font-weight:800;display:inline-block;margin-top:12px}
.refer-small{font-size:11px;font-style:italic;margin-top:8px;opacity:0.8}
.our-services{text-align:center;margin:16px 0 10px}
.our-services span{background:#0F2A4D;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.box{border-radius:16px;padding:16px 10px;text-align:center;color:#fff;font-weight:800;font-size:14px}
.box small{display:block;font-weight:400;font-size:12px;margin-top:2px}
.box.dark{background:#0F2A4D}
.box.blue{background:#2A8CFF}
.box.yellow{background:#FFD700;color:#0F2A4D}
.box.purple{background:#A855F7}
.footer{background:#0F2A4D;color:#FFD700;text-align:center;padding:14px;border-radius:20px;margin:14px 12px 0 12px;font-weight:800;font-size:14px}
</style>
</head>
<body>

<div class="header">
<div><h2>PayYou <span>Nigeria</span><small>Fast • Secure • Reliable</small></h2></div>
<button class="btn-login">Register / Login</button>
</div>

<div class="nav-pills">
<div>Balance</div><div>|</div><div>Fund</div><div>|</div><div>Referral</div>
</div>

<div class="hero-navy">
<div class="badge-yellow">BUY CHEAP</div>
<h1>AIRTIME &<br><span class="y">DATA</span></h1>
<div class="sub">Top Up Anytime, Anywhere!</div>
<div class="refer-yellow">Refer 10 people to get #1000</div>
<div class="refer-small">Stay Connected Always!</div>
</div>

<div class="our-services"><span>Our Services</span></div>

<div class="grid">
<div class="box dark">Airtime<br><small>All Networks</small></div>
<div class="box blue">Data<br><small>All Networks</small></div>
<div class="box yellow">TV Subscription</div>
<div class="box purple">Electricity Bills</div>
</div>

<div class="footer">PayYou Nigeria - Fast • Secure • Reliable</div>

</body>
</html>
