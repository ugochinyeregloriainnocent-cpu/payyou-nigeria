<script>
// FIXED LOGIN - Use localStorage so it stays logged in
let logged = localStorage.getItem('payyou_login') === 'true';
let bal = parseInt(localStorage.getItem('payyou_bal') || '0');

window.onload = () => {
  updBal(); upd();
  if(!logged){ 
    document.getElementById('lg').style.display='flex';
  } else {
    document.getElementById('lg').style.display='none';
  }
}

function upd(){
  let lb=document.getElementById('loginBtn'), lo=document.getElementById('logoutBtn');
  if(lb && lo){
    lb.style.display=logged?'none':'block';
    lo.style.display=logged?'block':'none';
  }
}
function updBal(){
  let el = document.getElementById('balText');
  if(el) el.innerText='#'+bal+'.00';
  let warn = document.getElementById('balWarn');
  if(warn) warn.style.display=bal<500?'block':'none';
}

// FIXED LOGIN FUNCTION
function login(){
  let a=document.getElementById('ph').value.trim();
  let b=document.getElementById('pw').value.trim();
  if(!a){ alert('Please enter your Phone or Email'); return; }
  if(!b){ alert('Please enter your Password'); return; }
  
  // Save login
  localStorage.setItem('payyou_login','true');
  localStorage.setItem('payyou_user',a);
  logged=true;
  upd();
  
  // Force close login popup
  document.getElementById('lg').style.display='none';
  
  alert('Login Successful! Welcome '+a);
}

function logout(){
  localStorage.removeItem('payyou_login');
  logged=false;
  upd();
  document.getElementById('lg').style.display='flex';
}

function check(id){
  if(!logged){
    alert('Please Register/Login first!');
    document.getElementById('lg').style.display='flex';
    return;
  }
  if(id==='bal') updBal();
  o(id);
}
function o(i){ document.getElementById(i).style.display='flex'; }
function x(i){ document.getElementById(i).style.display='none'; }
function c(e,i){ if(e.target.id==i) x(i); }
function goHome(){ document.querySelectorAll('.m').forEach(a=>{ a.style.display='none'; }); if(!logged) document.getElementById('lg').style.display='flex'; }
function sh(){let v=document.getElementById('dNet').value;['m','g','a','n'].forEach(k=>document.getElementById(k+'P').style.display='none');document.getElementById(v+'P').style.display='block'}
function shTV(){let v=document.getElementById('tvNet').value;['d','gt','st'].forEach(k=>document.getElementById(k+'P').style.display='none');document.getElementById(v+'P').style.display='block'}
function doFund(){let amt=parseInt(document.getElementById('fundAmt').value),name=document.getElementById('fundName').value;if(!amt||amt<100){alert('Enter amount min #100');return;}if(!name){alert('Enter your name');return;}alert('Thanks '+name+'! Received #'+amt+' to 9063772447. Demo: adding to balance.');bal+=amt;localStorage.setItem('payyou_bal',bal);updBal();x('fund');alert('Wallet Funded! New Balance: #'+bal);}
function need(needAmt){if(bal<needAmt){alert('INSUFFICIENT FUNDS! Balance: #'+bal+' Need: #'+needAmt+'\nPlease Fund Wallet First to 9063772447 (Opay)!');check('fund');return false;}return true;}
function buyAirtime(){let amt=parseInt(document.getElementById('airAmt').value),ph=document.getElementById('airPhone').value;if(!ph||!amt){alert('Enter phone and amount');return;}if(!need(amt))return;bal-=amt;localStorage.setItem('payyou_bal',bal);updBal();alert('Airtime #'+amt+' sent to '+ph+'! New Balance: #'+bal);x('air');}
function buyData(){let v=document.getElementById('dNet').value,sel=document.getElementById(v+'Val');let amt=parseInt(sel.value),ph=document.getElementById('dataPhone').value;if(!ph){alert('Enter phone');return;}if(!need(amt))return;bal-=amt;localStorage.setItem('payyou_bal',bal);updBal();alert('Data Purchase Successful! #'+amt+' deducted. New Balance: #'+bal);x('data');}
function buyTV(){let v=document.getElementById('tvNet').value,sel=document.getElementById(v+'Val');let base=parseInt(sel.value);let total=base+150;let smart=document.getElementById('tvSmart').value;if(!smart){alert('Enter smartcard/IUC');return;}if(!need(total))return;bal-=total;localStorage.setItem('payyou_bal',bal);updBal();alert('TV Paid! #'+total+' deducted. New Balance: #'+bal);x('tv');}
function buyEL(){let amt=parseInt(document.getElementById('elAmt').value),meter=document.getElementById('elMeter').value;if(!meter){alert('Enter meter number');return;}if(!amt||amt<1000){alert('Min #1000 for electricity');return;}let total=amt+100;if(!need(total))return;bal-=total;localStorage.setItem('payyou_bal',bal);updBal();alert('Electricity Paid! #'+total+' deducted. New Balance: #'+bal);x('el');}
</script>
